name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  source-gate:
    name: Source gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: |
          npm ci --prefix apps/api
          npm ci --prefix apps/dashboard
          npm ci --prefix apps/widget
          npm ci --prefix apps/reporter
          npm ci --prefix packages/widget-sdk

      - name: Print npm version
        run: npm -v

      - name: Verify lockfiles unchanged
        run: git diff --exit-code -- package-lock.json apps/api/package-lock.json apps/dashboard/package-lock.json apps/widget/package-lock.json apps/reporter/package-lock.json packages/widget-sdk/package-lock.json

      - name: Typecheck API
        run: npm run check:api

      - name: Analytics contract tests
        run: npm run test:analytics-contract

      - name: Webhook HMAC tests
        run: npm run test:webhook-hmac

      - name: Typecheck Dashboard
        run: npm run check:dashboard

      - name: Typecheck Widget
        run: npm run check:widget

      - name: Typecheck Reporter
        run: npm run check:reporter

      - name: Accessibility baseline tests
        run: npm run test:accessibility

      - name: NOLIS golden question contract gate
        run: npm run eval:nolis-demo

      - name: Authorization matrix check
        run: npm run security:check-authorization-matrix

      - name: Security boundary gate
        run: npm run test:security-boundaries

      - name: Smoke tests
        run: npm run test:smoke

      - name: E2E tests
        run: npm run test:e2e

      - name: Build API
        run: npm run build:api

      - name: Build Dashboard
        run: npm run build:dashboard

      - name: Build Widget
        run: npm run build:widget

      - name: Build Reporter
        run: npm run build:reporter

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Run production-context audits
        run: npm run security:audit:production-contexts

  security-postgres:
    name: Security PostgreSQL isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: security_boundary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d security_boundary_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECURITY_POSTGRES_DATABASE_URL: postgres://postgres:postgres@localhost:5432/security_boundary_test
      SECURITY_POSTGRES_EXECUTE: "1"
      SECURITY_POSTGRES_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated PostgreSQL security checks
        run: npm run test:security:postgres

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose --env-file .env.example config

      - name: Build API image
        run: docker compose --env-file .env.example build api

      - name: Build Dashboard image
        run: |
          docker compose --env-file .env.example build dashboard
          docker build --target build -t ai-chatbot-dashboard-build apps/dashboard

      - name: Build Widget image
        run: docker compose --env-file .env.example build widget

      - name: Build Reporter image
        run: docker compose --env-file .env.example build reporter

      - name: Build Proxy image
        run: docker compose --env-file .env.example build proxy

      - name: Verify built images
        run: |
          set -euo pipefail
          docker image inspect ai-chatbot-api >/dev/null
          docker image inspect ai-chatbot-dashboard >/dev/null
          docker image inspect ai-chatbot-widget >/dev/null
          docker image inspect ai-chatbot-reporter >/dev/null
          docker run --rm --entrypoint node ai-chatbot-api -v | grep '^v24.17.0$'
          docker run --rm --entrypoint node ai-chatbot-dashboard -v | grep '^v24.17.0$'
          docker run --rm --entrypoint node ai-chatbot-reporter -v | grep '^v24.17.0$'
          test "$(docker image inspect ai-chatbot-dashboard --format '{{json .Config.Cmd}}')" = '["node","app/server.js"]'
          docker run --rm --entrypoint test ai-chatbot-dashboard -f /app/app/server.js
          docker run --rm --entrypoint test ai-chatbot-dashboard -d /app/app/.next/static
          docker run --rm --entrypoint test ai-chatbot-dashboard -d /app/app/public
          docker run --rm --entrypoint sh ai-chatbot-dashboard -c 'find /app/app/.next/static -type f \( -name "*.css" -o -name "*.js" \) | grep -q .'
          docker run --rm --entrypoint sh ai-chatbot-dashboard -c '! find /app -name ".env" -o -name ".env.*" | grep -q .'
          test "$(docker image inspect ai-chatbot-api --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "unknown"
          test "$(docker image inspect ai-chatbot-dashboard --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "unknown"
          test "$(docker image inspect ai-chatbot-widget --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "unknown"
          docker run --rm --entrypoint sh ai-chatbot-widget -c 'test -f /usr/share/nginx/html/version.json && grep -q "\"service\":\"widget\"" /usr/share/nginx/html/version.json && grep -q "\"commit\":\"unknown\"" /usr/share/nginx/html/version.json'
          test "$(docker image inspect ai-chatbot-api --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect ai-chatbot-dashboard --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect ai-chatbot-reporter --format '{{.Config.User}}')" = "node"

      - name: Verify dashboard production dependency tree
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node ai-chatbot-dashboard-build -e "const p=require('next/package.json'); const postcss=require('postcss/package.json'); const minimum='8.5.18'; const atLeast=(actual, required)=>{ const a=actual.split('.').map(Number); const r=required.split('.').map(Number); for (let i=0; i<3; i+=1) { if ((a[i]||0) > (r[i]||0)) return true; if ((a[i]||0) < (r[i]||0)) return false; } return true; }; console.log('next='+p.version); console.log('postcss='+postcss.version); if (!atLeast(postcss.version, minimum)) throw new Error('Expected standalone postcss >= '+minimum+', got '+postcss.version); console.log('standalone-postcss-verified='+postcss.version)"
          docker run --rm --entrypoint node ai-chatbot-dashboard -e "try { const postcss=require('postcss/package.json'); const minimum='8.5.18'; const atLeast=(actual, required)=>{ const a=actual.split('.').map(Number); const r=required.split('.').map(Number); for (let i=0; i<3; i+=1) { if ((a[i]||0) > (r[i]||0)) return true; if ((a[i]||0) < (r[i]||0)) return false; } return true; }; console.log('runtime-postcss='+postcss.version); if (!atLeast(postcss.version, minimum)) throw new Error('Expected runtime postcss >= '+minimum+', got '+postcss.version); console.log('runtime-postcss-verified='+postcss.version); } catch (error) { if (error && error.code === 'MODULE_NOT_FOUND') { console.log('runtime-postcss=not-present'); process.exit(0); } throw error; }"
