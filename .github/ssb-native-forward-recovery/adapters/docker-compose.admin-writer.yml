# Standalone application-only transition; never combine with legacy service overlays.
# Existing external networks only. No DB, Redis or proxy recreation.
# Fresh, generation-specific project and container names require start contract version 3.
x-app: &app
  pull_policy: never
  restart: "no"
  user: "1000:1000"
  security_opt: [no-new-privileges:true]
x-state: &state
  type: bind
  source: ${MAINTENANCE_HOST_STATE:?required}
  target: /run/ssb-maintenance
  bind: {create_host_path: false}
x-runtime: &runtime
  type: bind
  source: ${ADMIN_WRITER_RUNTIME_HOST_FILE:?required}
  target: /run/ssb-runtime-contract.json
  read_only: true
  bind: {create_host_path: false}
x-key: &key
  type: bind
  source: ${ADMIN_WRITER_KEY_HOST_FILE:?required}
  target: /run/ssb-writer-signing-key
  read_only: true
  bind: {create_host_path: false}
x-maintenance: &maintenance
  NODE_ENV: production
  APP_ENV: production
  MAINTENANCE_STATE_ROOT: /run/ssb-maintenance
  MAINTENANCE_SERVICE: ${MAINTENANCE_SERVICE:?required}
  MAINTENANCE_GENERATION: ${MAINTENANCE_GENERATION:?required}
services:
  api:
    <<: *app
    container_name: ${RETAINED_API_NAME:?fresh generation name required}
    image: ${ADMIN_WRITER_API_IMAGE:?immutable image required}
    environment:
      <<: *maintenance
      MAINTENANCE_PARTICIPANT_ID: ${RETAINED_API_NAME:?required}
      MAINTENANCE_IMAGE_ID: ${ADMIN_WRITER_API_IMAGE:?required}
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?ssb_runtime required}
      REDIS_URL: ${REDIS_URL:?existing Redis binding required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?existing private provider binding required}
      ADMIN_KEY: ${ADMIN_KEY:?existing API verifier binding required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?required}
      DASHBOARD_INTERNAL_TOKEN: ${DASHBOARD_INTERNAL_TOKEN:?required}
      RUN_MIGRATIONS_ON_STARTUP: "false"
      ALLOW_PRODUCTION_AUTO_MIGRATIONS: "false"
      ADMIN_WRITER_RUNTIME_FILE: /run/ssb-runtime-contract.json
      REPORTER_API_TOKEN: ${REPORTER_API_TOKEN:?required}
      REPORTER_SITE_BINDINGS: ${REPORTER_SITE_BINDINGS:?required}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:?required}
      OPENAI_MODEL: ${OPENAI_MODEL:?required}
      SITE_PILOT_ACCESS_RULES_JSON: ${SITE_PILOT_ACCESS_RULES_JSON:?explicit rules or [] required}
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:?existing key required}
      INTEGRATION_SECRET_KEY_PREVIOUS: ${INTEGRATION_SECRET_KEY_PREVIOUS?explicit existing value required}
      INTEGRATION_SECRET_LEGACY_KEYS: ${INTEGRATION_SECRET_LEGACY_KEYS?explicit existing value required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?required}
      API_DOMAIN: ${API_DOMAIN:?required}
      WIDGET_DOMAIN: ${WIDGET_DOMAIN:?required}
      SITE_DOMAIN_ALLOWLIST_MODE: ${SITE_DOMAIN_ALLOWLIST_MODE:?required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS?explicit existing value required}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?required}
      PUBLIC_WIDGET_BUNDLE_URL: ${PUBLIC_WIDGET_BUNDLE_URL:?required}
      NEXT_PUBLIC_WIDGET_LOADER_URL: ${NEXT_PUBLIC_WIDGET_LOADER_URL:?required}
      SMTP_HOST: ${SMTP_HOST:?required}
      SMTP_PORT: ${SMTP_PORT:?required}
      SMTP_USER: ${SMTP_USER:?required}
      SMTP_PASS: ${SMTP_PASS:?required}
      REPORTS_FROM_EMAIL: ${REPORTS_FROM_EMAIL:?required}
      LEAD_NOTIFICATION_EMAIL: ${LEAD_NOTIFICATION_EMAIL?explicit existing value required}
      ADMIN_EMAIL: ${ADMIN_EMAIL?explicit existing value required}
      APP_URL: ${APP_URL?explicit existing value required}
    volumes: [*state, *runtime]
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    networks: [internal, egress, widget_api]
  dashboard:
    <<: *app
    container_name: ${RETAINED_DASHBOARD_NAME:?fresh generation name required}
    image: ${ADMIN_WRITER_DASHBOARD_IMAGE:?immutable image required}
    environment:
      NODE_ENV: production
      APP_ENV: production
      BACKEND_BASE_URL: http://api:5000
      ADMIN_WRITER_BASE_URL: http://admin-writer:3011
      ADMIN_WRITER_SIGNING_KEY_FILE: /run/ssb-writer-signing-key
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?required}
      DASHBOARD_INTERNAL_TOKEN: ${DASHBOARD_INTERNAL_TOKEN:?required}
      ADMIN_PANEL_PASSWORD_HASH: ${ADMIN_PANEL_PASSWORD_HASH:?existing hash required}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:?confirmed HTTPS origin required}
      REDIS_URL: ${REDIS_URL:?existing persistent login limiter required}
      NEXT_PUBLIC_WIDGET_LOADER_URL: ${NEXT_PUBLIC_WIDGET_LOADER_URL:?required}
      OPERATOR_PANEL_PASSWORD_HASH: ${OPERATOR_PANEL_PASSWORD_HASH?explicit existing value required}
    volumes: [*key]
    tmpfs:
      - /tmp:rw,nosuid,size=16m
    networks: [internal, admin_writer, ingress]
  admin-writer:
    <<: *app
    container_name: ${RETAINED_WRITER_NAME:?fresh generation name required}
    image: ${ADMIN_WRITER_API_IMAGE:?required}
    command: [node, dist/admin-writer/server.js]
    read_only: true
    cap_drop: [ALL]
    environment:
      <<: *maintenance
      MAINTENANCE_PARTICIPANT_ID: ${RETAINED_WRITER_NAME:?required}
      MAINTENANCE_IMAGE_ID: ${ADMIN_WRITER_API_IMAGE:?required}
      ADMIN_WRITER_DATABASE_URL_FILE: /run/ssb-writer-db
      ADMIN_WRITER_SIGNING_KEY_FILE: /run/ssb-writer-signing-key
      ADMIN_WRITER_RUNTIME_FILE: /run/ssb-runtime-contract.json
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?required}
      DASHBOARD_INTERNAL_TOKEN: ${DASHBOARD_INTERNAL_TOKEN:?required}
    volumes:
      - *state
      - *runtime
      - *key
      - type: bind
        source: ${ADMIN_WRITER_DB_HOST_FILE:?required}
        target: /run/ssb-writer-db
        read_only: true
        bind: {create_host_path: false}
    networks: [internal, admin_writer]
  reporter:
    <<: *app
    container_name: ${RETAINED_REPORTER_NAME:?fresh generation name required}
    image: ${ADMIN_WRITER_REPORTER_IMAGE:?immutable image required}
    environment:
      <<: *maintenance
      REPORTER_API_BASE_URL: http://api:5000
      REPORTER_API_TOKEN: ${REPORTER_API_TOKEN:?required}
      REPORTER_SITE_BINDINGS: ${REPORTER_SITE_BINDINGS:?required}
      SMTP_HOST: ${SMTP_HOST:?bound destination required}
      SMTP_PORT: ${SMTP_PORT:?required}
      SMTP_USER: ${SMTP_USER:?required}
      SMTP_PASS: ${SMTP_PASS:?required}
      REPORTS_FROM_EMAIL: ${REPORTS_FROM_EMAIL:?required}
    volumes: [*state]
    networks: [internal, egress]
  widget:
    container_name: ${RETAINED_WIDGET_NAME:?fresh generation name required}
    image: ${ADMIN_WRITER_WIDGET_IMAGE:?immutable image required}
    pull_policy: never
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,size=16m
      - /var/cache/nginx:rw,nosuid,size=16m
      - /var/run:rw,nosuid,size=1m
    networks: [widget_api, ingress]
networks:
  widget_api:
    external: true
    name: ${BOUND_WIDGET_API_NETWORK:?required}
  internal:
    external: true
    name: ${BOUND_INTERNAL_NETWORK:?required}
  admin_writer:
    external: true
    name: ${BOUND_WRITER_NETWORK:?required}
  ingress:
    external: true
    name: ${BOUND_INGRESS_NETWORK:?required}
  egress:
    external: true
    name: ${BOUND_EGRESS_NETWORK:?required}
