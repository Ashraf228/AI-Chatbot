services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/chatbot
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      ADMIN_KEY: ${ADMIN_KEY}
      SITE_DOMAIN_ALLOWLIST_MODE: ${SITE_DOMAIN_ALLOWLIST_MODE:-strict}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
      PUBLIC_WIDGET_BUNDLE_URL: ${PUBLIC_WIDGET_BUNDLE_URL:-http://localhost:8080/widget.js}
    ports:
      - "5001:5000"
    depends_on:
      - db
      - redis

  widget:
    build:
      context: .
      dockerfile: ./apps/widget/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  dashboard:
    build:
      context: ./apps/dashboard
    environment:
      NODE_ENV: production
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://api:5000}
      ADMIN_KEY: ${ADMIN_KEY}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      NEXT_PUBLIC_WIDGET_LOADER_URL: ${NEXT_PUBLIC_WIDGET_LOADER_URL:-http://localhost:8080/loader.js}
    ports:
      - "3000:3000"
    depends_on:
      - api

  reporter:
    build:
      context: ./apps/reporter
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/chatbot
      REDIS_URL: redis://redis:6379
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://api:5000}
      REPORTER_API_BASE_URL: ${REPORTER_API_BASE_URL:-http://api:5000}
      ADMIN_KEY: ${ADMIN_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      REPORTS_FROM_EMAIL: ${REPORTS_FROM_EMAIL}
      REPORTER_JOB: ${REPORTER_JOB:-weekly}
    command: ["npm", "run", "start", "--", "${REPORTER_JOB:-weekly}"]
    depends_on:
      - db
      - api
    profiles:
      - reporter

volumes:
  pgdata:
